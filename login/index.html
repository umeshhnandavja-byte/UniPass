<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>UniPass - Login</title>
    <style>
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-header">
            <div class="logo">Uni<span>Pass</span></div>
            <p>Sign in to access your sponsorship portal</p>
        </div>

        <!-- Role Switcher -->
        <div class="role-toggle">
            <button class="role-btn active" type="button" onclick="setRole('student')">Student Applicant</button>
            <button class="role-btn" type="button" onclick="setRole('dso')">DSO / University Officer</button>
        </div>

        <form action="profile.html" method="GET" id="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="form-actions">
                <label style="font-weight: normal; cursor: pointer;">
                    <input type="checkbox" style="margin-right: 6px;"> Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="btn-submit" id="submit-btn">Sign In as Student</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="../register/">Register here</a>
        </div>
    </div>

    <script src="index.js"></script>

</body>
</html>
