<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniPass - Create Account</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="auth-card">
        <div class="auth-header">
            <div class="logo">Uni<span>Pass</span></div>
            <p>Create an account to start your international visa sponsorship application</p>
        </div>

        <form action="form.html" method="GET">
            <div class="form-grid">
                <div class="form-group">
                    <label for="first-name">Given Name(s) *</label>
                    <input type="text" id="first-name" placeholder="John" required>
                </div>

                <div class="form-group">
                    <label for="last-name">Surname *</label>
                    <input type="text" id="last-name" placeholder="Smith" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" placeholder="john.smith@example.com" required>
            </div>

            <div class="form-group">
                <label for="citizenship">Country of Passport Citizenship *</label>
                <select id="citizenship" required>
                    <option value="">-- Select Country --</option>
                    <option value="IN">India</option>
                    <option value="CN">China</option>
                    <option value="NG">Nigeria</option>
                    <option value="BR">Brazil</option>
                    <option value="KR">South Korea</option>
                    <option value="OTHER">Other Country</option>
                </select>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password *</label>
                    <input type="password" id="confirm-password" placeholder="••••••••" required>
                </div>
            </div>

            <div class="terms-text">
                By registering, you agree that UniPass will process your passport MRZ and financial records in compliance with host university privacy frameworks.
            </div>

            <button type="submit" class="btn-submit">Create Student Account</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="../login/">Sign in</a>
        </div>
    </div>

</body>
</html>
